<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Management — We Share Foundation LBG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --navy-950:#101E30; --navy-800:#1B3A5C; --rose-600:#AC3B63; --rose-700:#8E2E50; --rose-100:#F5E4EA;
    --gold-500:#CE9A44; --sand-100:#F1E8D7; --sand-50:#F8F3E8; --paper:#FDFBF6; --ink-900:#221E19; --ink-600:#5C5346;
    --line:rgba(34,30,25,.12);
    --display:'Fraunces',serif; --body:'Work Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--body); background:var(--sand-100); color:var(--ink-900); -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 28px; }
  :focus-visible { outline:3px solid var(--gold-500); outline-offset:3px; }

  /* Header */
  header.site { position:sticky; top:0; z-index:50; background:rgba(248,243,232,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; padding:14px 28px; max-width:1180px; margin:0 auto; gap:12px; }
  .brand { display:flex; align-items:center; gap:12px; text-decoration:none; }
  .brand img { width:42px; height:42px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--rose-600); }
  .brand .name { font-family:var(--display); font-weight:600; font-size:15.5px; color:var(--navy-800); }
  .btn { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; padding:10px 20px; border-radius:999px; text-decoration:none; border:1px solid var(--navy-800); color:var(--navy-800); background:none; cursor:pointer; font-family:var(--body); transition:background .18s, color .18s; }
  .btn:hover { background:var(--navy-800); color:#fff; }
  .btn-primary { background:var(--rose-600); border-color:var(--rose-600); color:#fff; }
  .btn-primary:hover { background:var(--rose-700); border-color:var(--rose-700); }

  /* Page intro */
  .intro { padding:72px 0 40px; }
  .intro h1 { font-family:var(--display); font-weight:500; font-size:clamp(34px,5vw,56px); color:var(--navy-800); line-height:1.08; margin:0 0 16px; max-width:720px; }
  .intro p { color:var(--ink-600); font-size:16.5px; line-height:1.65; max-width:560px; margin:0; }

  /* Team grid */
  .team { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:22px; padding:24px 0 96px; }
  .member { background:var(--paper); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  .photo { aspect-ratio:4/4.4; background:var(--navy-800); position:relative; display:flex; align-items:center; justify-content:center; }
  .photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo .initials { font-family:var(--display); font-size:56px; color:var(--gold-500); }
  .member .info { padding:20px 22px 24px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .member h2 { font-family:var(--display); font-size:20px; font-weight:600; color:var(--navy-800); margin:0; }
  .member .role { font-size:13.5px; color:var(--rose-700); font-weight:500; }
  .member p { font-size:14px; color:var(--ink-600); line-height:1.55; margin:8px 0 16px; }
  .member .btn { margin-top:auto; align-self:flex-start; padding:8px 16px; font-size:13px; }

  /* Profile dialog */
  dialog { border:none; border-radius:20px; padding:0; width:min(680px,92vw); background:var(--paper); color:var(--ink-900); }
  dialog::backdrop { background:rgba(16,30,48,.6); }
  .dlg-grid { display:grid; grid-template-columns:220px 1fr; }
  .dlg-grid .photo { aspect-ratio:auto; min-height:100%; }
  .dlg-body { padding:32px 30px; }
  .dlg-body h3 { font-family:var(--display); font-size:26px; font-weight:500; color:var(--navy-800); margin:0 0 4px; }
  .dlg-body .role { color:var(--rose-700); font-weight:500; font-size:14px; margin-bottom:16px; }
  .dlg-body p { font-size:15px; line-height:1.65; color:var(--ink-600); margin:0 0 14px; }
  .dlg-body .contact { font-size:14px; color:var(--navy-800); margin-bottom:20px; }
  .dlg-close { float:right; }

  footer { background:var(--navy-950); color:rgba(255,255,255,.65); padding:28px 0; font-size:13px; }
  footer .wrap { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }

  @media (max-width:640px) {
    .wrap { padding:0 20px; }
    .nav-inner { padding:12px 20px; }
    .brand .name { font-size:14px; }
    .intro { padding:48px 0 24px; }
    .dlg-grid { grid-template-columns:1fr; }
    .dlg-grid .photo { aspect-ratio:16/9; min-height:0; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="logo.jpg" alt="We Share Foundation logo">
      <div class="name">We Share Foundation</div>
    </a>
    <a href="index.html" class="btn">Back to home</a>
  </div>
</header>

<main>
  <section class="intro">
    <div class="wrap">
      <h1>The people behind the work.</h1>
      <p>Meet the team that leads We Share Foundation LBG and keeps our programs, finances and promises on track.</p>
    </div>
  </section>

  <div class="wrap">
    <div class="team" id="team"></div>
  </div>
</main>

<dialog id="profile" aria-labelledby="dlg-name">
  <div class="dlg-grid">
    <div class="photo" id="dlg-photo"></div>
    <div class="dlg-body">
      <button class="btn dlg-close" id="dlg-close" style="padding:6px 14px;font-size:13px;">Close</button>
      <h3 id="dlg-name"></h3>
      <div class="role" id="dlg-role"></div>
      <p id="dlg-bio"></p>
      <div class="contact" id="dlg-contact"></div>
    </div>
  </div>
</dialog>

<footer>
  <div class="wrap">
    <span>&copy; 2026 We Share Foundation LBG. All rights reserved.</span>
    <span>Made with love in Ghana.</span>
  </div>
</footer>

<script>
  /* ===== EDIT THIS LIST: add, remove or change team members =====
     photo: put each image in a "management" folder (e.g. management/jane.jpg).
     If a photo is missing, the member's initials show instead. */
  const members = [
    { name: "Full Name", role: "Founder & Executive Director", photo: "management/member1.jpg",
      short: "Leads the foundation's vision and community partnerships.",
      bio: "Write a short biography here: background, what led them to start or join the foundation, and the work they lead today.",
      email: "info@wesharefoundation.org" },
    { name: "Full Name", role: "Programs Manager", photo: "management/member2.jpg",
      short: "Plans and runs our outreach visits and supply drives.",
      bio: "Write a short biography here: experience, responsibilities and what they are most proud of at the foundation.",
      email: "" },
    { name: "Full Name", role: "Finance & Administration", photo: "management/member3.jpg",
      short: "Keeps our records transparent and our donations accountable.",
      bio: "Write a short biography here: qualifications, role and how they safeguard donor funds.",
      email: "" },
    { name: "Full Name", role: "Volunteer Coordinator", photo: "management/member4.jpg",
      short: "Recruits, trains and supports our volunteers in the field.",
      bio: "Write a short biography here: experience working with volunteers and communities.",
      email: "" }
  ];

  const team = document.getElementById('team');
  const dlg = document.getElementById('profile');

  const initials = n => n.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();

  // Photo with initials fallback (initials sit behind the image; hidden image removes itself on error)
  function photoHTML(m) {
    return '<span class="initials">' + initials(m.name) + '</span>' +
           '<img src="' + m.photo + '" alt="Photo of ' + m.name + '" onerror="this.remove()">';
  }

  members.forEach((m, i) => {
    const card = document.createElement('article');
    card.className = 'member';
    card.innerHTML =
      '<div class="photo">' + photoHTML(m) + '</div>' +
      '<div class="info"><h2>' + m.name + '</h2><div class="role">' + m.role + '</div>' +
      '<p>' + m.short + '</p>' +
      '<button class="btn" data-i="' + i + '">View profile</button></div>';
    team.appendChild(card);
  });

  team.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    const m = members[b.dataset.i];
    document.getElementById('dlg-photo').innerHTML = photoHTML(m);
    document.getElementById('dlg-name').textContent = m.name;
    document.getElementById('dlg-role').textContent = m.role;
    document.getElementById('dlg-bio').textContent = m.bio;
    document.getElementById('dlg-contact').innerHTML = m.email ? 'Email: <a href="mailto:' + m.email + '">' + m.email + '</a>' : '';
    dlg.showModal();
  });

  document.getElementById('dlg-close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
</script>
</body>
</html>
